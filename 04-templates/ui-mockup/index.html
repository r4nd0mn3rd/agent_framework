<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root { --bg:#0b0d10; --fg:#e8e8ea; --accent:#7aa2f7; --muted:#8a8f98; --card:#14171c; --border:#23262d; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .muted { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  button { background: var(--accent); color: #0b0d10; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 600; cursor: pointer; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>{{TITLE}}</h1>
    <p class="muted">{{DESCRIPTION}}</p>
    <!-- MOCKUP BODY START -->
    <div class="card">Replace this block with mockup content.</div>
    <!-- MOCKUP BODY END -->
  </div>
</body>
</html>
